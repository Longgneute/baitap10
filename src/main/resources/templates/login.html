<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
* {
	box-sizing: border-box;
}

body {
	min-height: 100vh;
	margin: 0;
	font-family: Arial, sans-serif;
	background: linear-gradient(135deg, #eef4ff, #f8fafc);
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 20px;
}

.login-card {
	width: 100%;
	max-width: 440px;
	background: #ffffff;
	border-radius: 24px;
	padding: 45px;
	box-shadow: 0 20px 55px rgba(15, 23, 42, 0.12);
}

.logo {
	width: 70px;
	height: 70px;
	margin: 0 auto 22px;
	border-radius: 18px;
	background: linear-gradient(135deg, #2563eb, #4f46e5);
	color: white;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 30px;
	font-weight: 700;
	box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
}

.title {
	text-align: center;
	color: #111827;
	font-size: 30px;
	font-weight: 700;
	margin-bottom: 8px;
}

.subtitle {
	text-align: center;
	color: #6b7280;
	font-size: 15px;
	margin-bottom: 32px;
}

.form-group {
	margin-bottom: 20px;
}

.form-label {
	display: block;
	color: #374151;
	font-size: 14px;
	font-weight: 600;
	margin-bottom: 8px;
}

.input-wrapper {
	position: relative;
}

.input-icon {
	position: absolute;
	left: 16px;
	top: 50%;
	transform: translateY(-50%);
	color: #9ca3af;
	font-size: 17px;
}

.form-control {
	height: 52px;
	border: 1px solid #dbe1ea;
	border-radius: 12px;
	padding-left: 45px;
	padding-right: 15px;
	font-size: 15px;
	background: #f9fafb;
	transition: all 0.2s ease;
}

.form-control:focus {
	background: #ffffff;
	border-color: #2563eb;
	box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
}

.form-control::placeholder {
	color: #9ca3af;
}

.btn-login {
	width: 100%;
	height: 52px;
	margin-top: 8px;
	border: none;
	border-radius: 12px;
	background: linear-gradient(135deg, #2563eb, #4f46e5);
	color: #ffffff;
	font-size: 16px;
	font-weight: 700;
	cursor: pointer;
	transition: all 0.2s ease;
	box-shadow: 0 8px 20px rgba(37, 99, 235, 0.20);
}

.btn-login:hover {
	transform: translateY(-1px);
	box-shadow: 0 12px 25px rgba(37, 99, 235, 0.28);
}

.btn-login:disabled {
	opacity: 0.7;
	cursor: not-allowed;
	transform: none;
}

.error-message {
	display: none;
	margin-bottom: 18px;
	padding: 12px 15px;
	border-radius: 10px;
	background: #fef2f2;
	border: 1px solid #fecaca;
	color: #dc2626;
	font-size: 14px;
	text-align: center;
}

.security-info {
	margin-top: 25px;
	padding: 12px 15px;
	border-radius: 10px;
	background: #f0fdf4;
	color: #15803d;
	font-size: 13px;
	text-align: center;
}

.footer {
	margin-top: 25px;
	text-align: center;
	color: #9ca3af;
	font-size: 12px;
}

@media ( max-width : 480px) {
	body {
		padding: 15px;
	}
	.login-card {
		padding: 35px 25px;
		border-radius: 20px;
	}
	.title {
		font-size: 26px;
	}
}
</style>
</head>

<body>

	<div class="login-card">

		<div class="logo">J</div>

		<div class="title">Đăng nhập</div>

		<div class="subtitle">Đăng nhập vào hệ thống JWT Demo</div>

		<div id="errorMessage" class="error-message">Email hoặc mật khẩu
			không chính xác.</div>

		<form id="loginForm">

			<div class="form-group">

				<label class="form-label" for="email"> Email </label>

				<div class="input-wrapper">

					<span class="input-icon"> ✉ </span> <input type="email" id="email"
						name="email" class="form-control" placeholder="Nhập email"
						autocomplete="email" required>

				</div>

			</div>

			<div class="form-group">

				<label class="form-label" for="password"> Mật khẩu </label>

				<div class="input-wrapper">

					<span class="input-icon"> 🔒 </span> <input type="password"
						id="password" name="password" class="form-control"
						placeholder="Nhập mật khẩu" autocomplete="current-password"
						required>

				</div>

			</div>

			<button type="submit" class="btn-login" id="loginBtn">Đăng
				nhập</button>

		</form>

		<div class="security-info">🔐 Đăng nhập được bảo vệ bằng JWT</div>

		<div class="footer">Spring Boot 4.1.1 · Spring Security · Nimbus
			JWT</div>

	</div>

	<script>

document.addEventListener("DOMContentLoaded", function () {

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", function (event) {

        event.preventDefault();

        errorMessage.style.display = "none";

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        loginBtn.disabled = true;
        loginBtn.textContent = "Đang đăng nhập...";

        fetch("/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        })
        .then(function (response) {

            if (!response.ok) {
                throw new Error("Login failed");
            }

            return response.json();
        })
        .then(function (data) {

            if (!data.token) {
                throw new Error("Token not found");
            }

            localStorage.setItem("token", data.token);

            window.location.href = "/user/profile";
        })
        .catch(function () {

            errorMessage.textContent =
                "Email hoặc mật khẩu không chính xác.";

            errorMessage.style.display = "block";

            loginBtn.disabled = false;
            loginBtn.textContent = "Đăng nhập";
        });

    });

});

</script>

</body>
</html>
