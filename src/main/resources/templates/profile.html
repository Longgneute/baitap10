<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông tin cá nhân</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	min-height: 100vh;
	margin: 0;
	background: linear-gradient(135deg, #eef4ff, #f8fafc);
	font-family: Arial, sans-serif;
}

.navbar-custom {
	background: #ffffff;
	box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
}

.navbar-brand {
	font-size: 24px;
	font-weight: 700;
	color: #2563eb;
}

.page {
	max-width: 1000px;
	margin: 55px auto;
	padding: 0 20px;
}

.profile-card {
	background: #ffffff;
	border-radius: 24px;
	overflow: hidden;
	box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
}

.cover {
	height: 190px;
	background: linear-gradient(135deg, #2563eb, #4f46e5);
}

.profile-body {
	padding: 0 45px 40px;
}

.avatar-box {
	width: 145px;
	height: 145px;
	margin-top: -72px;
	border-radius: 50%;
	padding: 6px;
	background: white;
	box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.avatar {
	width: 100%;
	height: 100%;
	border-radius: 50%;
	object-fit: cover;
	background: #e5e7eb;
}

.profile-top {
	display: flex;
	justify-content: space-between;
	align-items: end;
}

.name {
	margin-top: 18px;
	margin-bottom: 5px;
	font-size: 30px;
	font-weight: 700;
	color: #111827;
}

.email {
	color: #6b7280;
	font-size: 16px;
}

.status {
	background: #ecfdf5;
	color: #059669;
	padding: 8px 15px;
	border-radius: 30px;
	font-size: 14px;
	font-weight: 600;
}

.status span {
	display: inline-block;
	width: 8px;
	height: 8px;
	margin-right: 6px;
	border-radius: 50%;
	background: #10b981;
}

.section-title {
	margin-top: 35px;
	margin-bottom: 18px;
	font-size: 19px;
	font-weight: 700;
	color: #111827;
}

.info-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 16px;
}

.info-box {
	padding: 20px;
	background: #f8fafc;
	border: 1px solid #e5e7eb;
	border-radius: 16px;
}

.info-label {
	margin-bottom: 7px;
	color: #6b7280;
	font-size: 12px;
	font-weight: 700;
	text-transform: uppercase;
}

.info-value {
	color: #111827;
	font-size: 16px;
	font-weight: 600;
	word-break: break-word;
}

.actions {
	display: flex;
	justify-content: flex-end;
	margin-top: 32px;
	padding-top: 25px;
	border-top: 1px solid #e5e7eb;
}

.btn-logout {
	padding: 11px 24px;
	border: none;
	border-radius: 10px;
	background: #dc2626;
	color: white;
	font-weight: 600;
}

.btn-logout:hover {
	background: #b91c1c;
}

.footer {
	margin-top: 25px;
	text-align: center;
	color: #9ca3af;
	font-size: 13px;
}

@media ( max-width : 768px) {
	.page {
		margin: 25px auto;
	}
	.profile-body {
		padding: 0 22px 30px;
	}
	.cover {
		height: 150px;
	}
	.avatar-box {
		width: 120px;
		height: 120px;
		margin-top: -60px;
	}
	.profile-top {
		display: block;
	}
	.name {
		font-size: 25px;
	}
	.status {
		display: inline-block;
		margin-top: 15px;
	}
	.info-grid {
		grid-template-columns: 1fr;
	}
	.actions {
		justify-content: center;
	}
	.btn-logout {
		width: 100%;
		text-align: center;
	}
}
</style>
</head>

<body>

	<nav class="navbar navbar-custom">
		<div class="container">
			<a class="navbar-brand" href="/"> JWT Demo </a> <span
				class="text-secondary"> Spring Boot 4.1.1 </span>
		</div>
	</nav>

	<div class="page">

		<div class="profile-card">

			<div class="cover"></div>

			<div class="profile-body">

				<div class="profile-top">

					<div>

						<div class="avatar-box">
							<img id="userImage" class="avatar" src="/images/default.svg"
								alt="Avatar">
						</div>

						<div id="userFullName" class="name">Đang tải...</div>

						<div id="userEmail" class="email">Đang tải...</div>

					</div>

					<div class="status">
						<span></span> Đang hoạt động
					</div>

				</div>

				<div class="section-title">Thông tin tài khoản</div>

				<div class="info-grid">

					<div class="info-box">
						<div class="info-label">User ID</div>

						<div id="userId" class="info-value">Đang tải...</div>
					</div>

					<div class="info-box">
						<div class="info-label">Họ và tên</div>

						<div id="userFullNameInfo" class="info-value">Đang tải...</div>
					</div>

					<div class="info-box">
						<div class="info-label">Email</div>

						<div id="userEmailInfo" class="info-value">Đang tải...</div>
					</div>

					<div class="info-box">
						<div class="info-label">Ngày tạo</div>

						<div id="userCreatedAt" class="info-value">Đang tải...</div>
					</div>

				</div>

				<div class="actions">

					<button type="button" id="logoutBtn" class="btn-logout">
						Đăng xuất</button>

				</div>

			</div>

		</div>

		<div class="footer">JWT Authentication · Nimbus JOSE JWT</div>

	</div>

	<script>

document.addEventListener("DOMContentLoaded", function () {

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "/login";
        return;
    }

    fetch("/users/me", {
        method: "GET",
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        }
    })
    .then(function (response) {

        if (!response.ok) {
            throw new Error("Unauthorized");
        }

        return response.json();
    })
    .then(function (user) {

        document.getElementById("userId").textContent =
            user.id ?? "N/A";

        document.getElementById("userFullName").textContent =
            user.fullName ?? "N/A";

        document.getElementById("userFullNameInfo").textContent =
            user.fullName ?? "N/A";

        document.getElementById("userEmail").textContent =
            user.email ?? "N/A";

        document.getElementById("userEmailInfo").textContent =
            user.email ?? "N/A";

        if (user.createdAt) {

            const date = new Date(user.createdAt);

            document.getElementById("userCreatedAt").textContent =
                date.toLocaleDateString("vi-VN");

        } else {

            document.getElementById("userCreatedAt").textContent =
                "N/A";
        }

        if (user.images && user.images.trim() !== "") {

            document.getElementById("userImage").src =
                user.images;
        }

    })
    .catch(function () {

        localStorage.removeItem("token");

        window.location.href = "/login";
    });

    document.getElementById("logoutBtn")
        .addEventListener("click", function () {

            localStorage.removeItem("token");

            window.location.href = "/login";
        });

});

</script>

</body>
</html>
